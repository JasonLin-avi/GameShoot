<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 快速入門教學</title>
    <style>
        /* 讓畫面滿版，並去除預設邊距與卷軸 */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 透過 ES Module 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==========================================
        // 1. 建立基本三大元素：場景 (Scene)、相機 (Camera)、渲染器 (Renderer)
        // ==========================================

        // 場景：所有 3D 物件、燈光放的地方
        const scene = new THREE.Scene();

        // 相機：決定我們用什麼角度、多遠的距離去觀察場景
        // 參數依序為：視角(FOV)、長寬比、近裁剪面、遠裁剪面
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5; // 將相機往後拉，才看得到原點的物體

        // 渲染器：把相機拍到的場景畫面畫在網頁的 <canvas> 上
        const renderer = new THREE.WebGLRenderer({ antialias: true }); // antialias 讓邊緣平滑
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. 建立 3D 物件 (Mesh = 幾何體 Geometry + 材質 Material)
        // ==========================================

        // 建立一個正立方體幾何體
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);

        // 建立材質（使用 MeshNormalMaterial，會根據面的法向量自動呈現繽紛的彩虹色）
        const material = new THREE.MeshNormalMaterial();

        // 結合成 Mesh（物件）並加入場景
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // ==========================================
        // 3. 動畫循環與渲染迴圈 (Animation Loop)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate); // 讓瀏覽器以每秒約 60 幀的速度持續呼叫這個函數

            // 讓立方體在每一幀都稍微轉動一點角度
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // 渲染器根據相機拍下場景
            renderer.render(scene, camera);
        }

        animate(); // 啟動動畫

        // ==========================================
        // 4. 視窗大小改變時的響應式處理
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
